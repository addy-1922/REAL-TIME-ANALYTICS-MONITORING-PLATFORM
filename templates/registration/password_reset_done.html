{% extends "base_auth.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<section class="auth-card auth-card--compact" aria-labelledby="reset-sent-title">
  <div class="status-illustration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg></div>
  <h1 id="reset-sent-title">Check your email</h1>
  <p>If an account matches that address, a password reset link has been sent. The link can only be used once and will expire.</p>
  <a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Return to sign in</a>
</section>
{% endblock %}
