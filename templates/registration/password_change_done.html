{% extends "base_app.html" %}

{% block title %}Password changed{% endblock %}

{% block content %}
<section class="auth-card auth-card--compact" aria-labelledby="password-changed-title">
  <div class="status-illustration status-illustration--success"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></div>
  <h1 id="password-changed-title">Password changed</h1>
  <p>Your password has been updated successfully. Use the new password the next time you sign in.</p>
  <a class="btn btn-primary btn-block" href="{% url 'accounts:profile' %}">Return to profile</a>
</section>
{% endblock %}
