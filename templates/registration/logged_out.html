{% extends "base_auth.html" %}

{% block title %}Signed out{% endblock %}

{% block content %}
<section class="auth-card auth-card--compact" aria-labelledby="signed-out-title">
  <div class="status-illustration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H5v14h5M14 8l4 4-4 4m4-4H9"/></svg></div>
  <h1 id="signed-out-title">You’re signed out</h1>
  <p>Your session has ended securely. Sign in again whenever you’re ready.</p>
  <a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Sign in</a>
</section>
{% endblock %}
