{% extends "base_auth.html" %}

{% block title %}Password reset complete{% endblock %}

{% block content %}
<section class="auth-card auth-card--compact" aria-labelledby="reset-complete-title">
  <div class="status-illustration status-illustration--success"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></div>
  <h1 id="reset-complete-title">Password reset complete</h1>
  <p>Your password has been reset successfully. You can now sign in with your new credentials.</p>
  <a class="btn btn-primary btn-block" href="{% url 'accounts:login' %}">Sign in</a>
</section>
{% endblock %}
