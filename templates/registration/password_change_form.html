{% extends "base_app.html" %}

{% block title %}Change password{% endblock %}

{% block content %}
<section class="auth-card" aria-labelledby="change-password-title">
  <div class="auth-card__header"><span class="auth-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><h1 id="change-password-title">Change password</h1><p>Use a strong password that you do not reuse elsewhere.</p></div>
  <form method="post" class="auth-form" data-loading-form>
    {% csrf_token %}
    {% include "registration/_form_fields.html" %}
    <button class="btn btn-primary btn-block" type="submit"><span>Change password</span><span class="button-loader" aria-hidden="true"></span></button>
  </form>
  <div class="auth-card__links"><a href="{% url 'accounts:profile' %}">Cancel</a></div>
</section>
{% endblock %}
